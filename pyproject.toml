[project]
name = "tissue-classification"
version = "0.1.0"
authors = [
    { name = "Vojtěch Cífka", email = "550433@mail.muni.cz" },
    { name = "Vít Musil", email = "musil@fi.muni.cz" },
]
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "hydra-core>=1.3.2",
    "mlflow>=3.6.0",
    "omegaconf>=2.3.0",
    "rationai-mlkit>=0.2.2",
    "openslide-python>=1.4.2",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.5",
]

[tool.uv.sources]
rationai-mlkit = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/mlkit.git" }