[project]
name = "tissue-classification"
version = "0.1.0"
authors = [
    { name = "Vojtěch Cífka", email = "550433@mail.muni.cz" },
    { name = "Vít Musil", email = "musil@fi.muni.cz" },
]
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "hydra-core>=1.3.2",
    "mlflow<3.0.0",
    "omegaconf>=2.3.0",
    "rationai-mlkit>=0.2.2",
    "openslide-python>=1.4.2",
    "rationai-masks",
    "ray>=2.51.1",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "rationai-sdk",
    "ratiopath>=1.2.0",
    "scikit-learn>=1.8.0",
    "numpy>=2.3.5",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.5",
    "types-tqdm",
    "pandas-stubs",
]

[tool.uv.sources]
rationai-mlkit = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/mlkit.git" }
rationai-sdk = { git = "https://gitlab.ics.muni.cz/rationai/infrastructure/rationai-sdk-python.git" }

[tool.uv]
override-dependencies = [
    "rationai-masks @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/masks.git@feature/modular-tissue-mask"
]
