# @package _global_

defaults:
  - /data: dataset
  - /class_mapping: collapse_alterations_to_other
  - /ml/data: embedding
  - _self_

mode: fit
runner: sklearn_linear

embedding_run_id: ${dataset.mlflow_artifacts.embedding_run_id}
kfold_strategy: stratified
kfold_run_id: ${dataset.mlflow_artifacts.stratified_kfold_run_id}
filter_tiles_run_id: ${dataset.mlflow_artifacts.filter_tiles_run_id}

train_embedding_uri: runs:/${embedding_run_id}/train/tiles
test_embedding_uri: runs:/${embedding_run_id}/test/tiles
train_metadata_uri: runs:/${kfold_run_id}/kfold_split/kfold_tiles.parquet
test_metadata_uri: runs:/${filter_tiles_run_id}/filter_tiles/test_tiles.parquet

val_fold: 0

tissue_prop_min: 0.2
thresholds:
  Nerve: 0.0
  Blood: 0.0
  Connective-Tissue: 0.4
  Fat: 0.6
  Epithelium: 0.2
  Muscle: 0.5
  Other: 0.5

model:
  solver: lbfgs
  penalty: l2
  C: 1.0
  class_weight: balanced
  max_iter: 1000
  tol: 1.0e-4
  n_jobs: null
  verbose: 0
  standardize: true

mlflow_artifact_path: lbfgs_logistic_regression

metadata:
  run_name: LBFGS Logistic Regression ${dataset.name} ${kfold_strategy} fold=${val_fold} C=${model.C} std=${model.standardize}
  description: "LBFGS multinomial logistic regression over frozen Virchow2 embeddings (run ${embedding_run_id}), ${kfold_strategy} kfold metadata ${kfold_run_id}."
  hyperparams:
    embedding_run_id: ${embedding_run_id}
    kfold_strategy: ${kfold_strategy}
    kfold_run_id: ${kfold_run_id}
    filter_tiles_run_id: ${filter_tiles_run_id}
    val_fold: ${val_fold}
    tissue_prop_min: ${tissue_prop_min}
    thresholds: ${thresholds}
    solver: ${model.solver}
    penalty: ${model.penalty}
    C: ${model.C}
    class_weight: ${model.class_weight}
    max_iter: ${model.max_iter}
    tol: ${model.tol}
    standardize: ${model.standardize}
