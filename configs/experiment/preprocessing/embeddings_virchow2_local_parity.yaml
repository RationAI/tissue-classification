# @package _global_

defaults:
  - /data: dataset
  - _self_

# Parity check for the local embedding backend: embed a small, deterministic
# subset of test tiles with Virchow2 locally and compare against the
# model-service embeddings (embedding_run_ids.virchow2) with
# preprocessing/embedding_parity.py. Same tile source as that run, so tiles
# join on (slide_id, x, y).
model: virchow2
backend: local
splits:
  - test
slide_sample_max_tiles: 5000
slide_sample_seed: 0
