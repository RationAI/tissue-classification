# @package _global_

# Pairs with the 0.5 MPP tiling run; tissue masks are sampled at a coarser MPP set below.
defaults:
  - /data: dataset
  - _self_

mpp: 2.0

mask_source:
  mlflow_run_id: ${dataset.mlflow_artifacts.tissue_masks_run_id}
  artifact_path: tissue_masks

masks:
  tissue: "{stem}.tiff"

mlflow_artifact_path: tissue_stats

metadata:
  run_name: Tissue statistics ${dataset.name}
  description: "Per-tile tissue coverage from tissue masks at ${mpp} MPP over tiling run ${dataset.mlflow_artifacts.tiling_run_id}."
  hyperparams:
    mpp: ${mpp}
    tiling_run_id: ${dataset.mlflow_artifacts.tiling_run_id}
    tissue_masks_run_id: ${dataset.mlflow_artifacts.tissue_masks_run_id}
