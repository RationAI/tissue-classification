# @package _global_

nerve_class: Nerve
epithelium_class: Epithelium
radius: ???
min_tiles: ???
# Resolution of the rasterised annotation masks (display only).
annotation_mpp: 2.0
# Display tiers of the nerve mask: shown candidates 1..10 (largest first) are
# tier 1, 11..50 tier 2, the rest tier 3.
display_tiers: [10, 50]
# Sizes of the top-k region lists scored in stats/ranking.csv.
ranking_ks: [10, 20, 50, 100]

metadata:
  run_name: PNI detection ${dataset.name}
  description: "Perineural invasion candidates where ${nerve_class} and ${epithelium_class} tile predictions meet within ${radius} grid steps, regions of at least ${min_tiles} tiles, from prediction run ${dataset.mlflow_artifacts.prediction_run_id}."
  hyperparams:
    radius: ${radius}
    min_tiles: ${min_tiles}
    prediction_run_id: ${dataset.mlflow_artifacts.prediction_run_id}
