# @package _global_

mlflow_artifact_path: threshold_stats

# Upstream artifact locations. Adjust if upstream `mlflow_artifact_path` differs.
tiling_tiles_artifact: train_split/tiles.parquet
tissue_tiles_artifact: tissue_stats/train_tiles.parquet
qc_tiles_artifact: qc_stats/train_tiles.parquet

# Number of empirical-quantile sample points used to draw survival curves.
survival_curve_points: 200

metadata:
  run_name: Threshold Stats ${dataset.name}
  description: "Per-tile ROI coverage statistics (tiling + tissue + qc) for threshold selection"
